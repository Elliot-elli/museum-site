<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 博雅博物馆</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<style>
:root{--ink:#193c36;--muted:#68746d;--paper:#f5f3ec;--line:#dcded2;--accent:#be603b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.9;padding:24px;text-align:center}
.box{max-width:560px}
.code{font-size:64px;font-weight:800;letter-spacing:.04em;color:var(--accent);margin:0 0 8px}
h1{font-size:22px;margin:0 0 12px}
p{color:var(--muted);font-size:15px;margin:0 0 24px}
a{display:inline-block;padding:10px 22px;border-radius:999px;background:var(--ink);color:#fff;
  text-decoration:none;font-size:14px}
a:hover{background:#0f2a26}
.hint{margin-top:22px;font-size:13px;color:var(--muted)}
.hint code{background:#e9eddf;padding:2px 7px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<main class="box">
  <p class="code">404</p>
  <h1>这个页面不存在</h1>
  <p>链接可能已失效，或地址输入有误。</p>
  <a href="/">返回首页</a>
